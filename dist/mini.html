<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>象棋屏幕助手 · 悬浮局势</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/mini.css"></head>
<body class="mini-body">
<div class="mini-card">
  <header class="mini-titlebar">
    <div id="mini-drag" class="mini-drag" title="按住标题栏拖动窗口"><span class="mini-grip" aria-hidden="true">⠿</span><strong>棋 · 悬浮局势</strong></div>
    <button id="mini-close" class="mini-close" aria-label="关闭悬浮窗" title="关闭小窗，继续后台分析和棋盘箭头">×</button>
  </header>
  <main class="mini-content">
    <div id="mini-status" class="mini-status">未开始</div>
    <div id="mini-turn" class="mini-turn" aria-live="polite">等待棋盘同步</div>
    <div id="mini-eval" class="mini-eval" aria-live="polite">等待分析</div>
    <div id="mini-move" class="mini-move">—</div>
    <div id="mini-guide" class="mini-guide" hidden><p id="mini-instruction"></p><div class="mini-coordinates"><span>起</span><strong id="mini-from"></strong><b> → </b><span>落</span><strong id="mini-to"></strong></div></div>
    <div id="mini-hint" class="mini-hint">点击“重新读取”选择浏览器或显示器</div>
    <div id="mini-detail" class="mini-detail"></div>
  </main>
  <footer class="mini-footer">
    <div class="mini-actions"><button id="mini-show">打开助手</button><button id="mini-pause" disabled>暂停</button><details class="mini-more"><summary>更多</summary><div><button id="mini-reset-size">恢复默认大小</button><button id="mini-restart">重新读取</button><button id="mini-stop" disabled>结束读取</button></div></details></div>
    <label class="mini-lock"><input type="checkbox" id="mini-lock">鼠标穿透整个小窗</label>
    <p id="mini-lock-note" class="mini-lock-note">拖动标题移动 · 拖右下角缩放</p>
  </footer>
  <button id="mini-resize" class="mini-resize" aria-label="调整悬浮窗大小" title="拖动调整大小；方向键微调"></button>
</div>
<script type="module" src="/mini.js"></script>
</body></html>
