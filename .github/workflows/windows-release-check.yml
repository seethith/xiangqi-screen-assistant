name: Windows package verification
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload tested installer to an existing draft release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and validate source
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          python scripts/fetch-models.py
          if ($LASTEXITCODE -ne 0) { throw 'Model fetch failed' }
          node scripts/prepare-runtime.cjs
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          npm run check
          python scripts/package-source.py
          npm run compliance:check
          if ($LASTEXITCODE -ne 0) { throw 'Compliance check failed' }
      - name: Build installer
        shell: pwsh
        run: |
          npm run desktop:win
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Test installed application and uninstall
        shell: pwsh
        run: |
          $installer = (Get-ChildItem 'release/v1.5.1/*Setup*.exe').FullName
          $testDir = Join-Path $env:LOCALAPPDATA 'Programs\xiangqi-release-test'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S',"/D=$testDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $executable = Join-Path $testDir '象棋屏幕助手.exe'
          if (!(Test-Path -LiteralPath $executable)) { Get-ItemProperty HKCU:\Software\XiangqiScreenAssistant; throw 'Application missing from chosen installation directory' }
          node scripts/test-release.cjs $executable
          if ($LASTEXITCODE -ne 0) { throw 'Installed app self-test failed' }
          $process = Start-Process -FilePath "$testDir/Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstaller failed' }
          for ($i=0; $i -lt 40 -and (Test-Path "$testDir/象棋屏幕助手.exe"); $i++) { Start-Sleep -Milliseconds 100 }
          if (Test-Path "$testDir/象棋屏幕助手.exe") { throw 'Uninstaller left application executable behind' }
      - name: Upload tested installer to draft release
        if: inputs.upload_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $asset = "release/v$version/xiangqi-screen-assistant-$version-windows-x64-setup.exe"
          Copy-Item (Get-ChildItem "release/v$version/*Setup*.exe").FullName $asset
          gh release upload "v$version" $asset --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload_release }}
        with:
          name: xiangqi-1.5.1-windows-x64
          retention-days: 1
          path: |
            release/v1.5.1/*Setup*.exe
            release/v1.5.1/installer-audit.json
