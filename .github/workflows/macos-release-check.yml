name: macOS package verification
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload tested DMG and source to an existing draft release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read package version
        id: package
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Prepare and validate source
        run: |
          npm ci
          python3 scripts/fetch-models.py
          node scripts/prepare-runtime.cjs
          npm test
          npm run check
          python3 scripts/compliance-manifest.py
          python3 scripts/package-source.py
          npm run compliance:check
      - name: Build and test Apple Silicon package
        run: |
          version=$(node -p 'require("./package.json").version')
          npm run desktop:mac -- --config.directories.output="release/v$version"
          node scripts/test-release.cjs "release/v$version/mac-arm64/象棋屏幕助手.app/Contents/MacOS/象棋屏幕助手"
          hdiutil verify "release/v$version/象棋屏幕助手-$version-arm64.dmg"
          cp "release/v$version/象棋屏幕助手-$version-arm64.dmg" "release/v$version/xiangqi-screen-assistant-$version-mac-arm64.dmg"
          cp dist/source.zip "release/v$version/xiangqi-screen-assistant-$version-source.zip"
      - name: Upload tested package and source to draft release
        if: inputs.upload_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$(gh release view "v$version" --json isDraft --jq '.isDraft')" = true
          gh release upload "v$version" "release/v$version/xiangqi-screen-assistant-$version-mac-arm64.dmg" "release/v$version/xiangqi-screen-assistant-$version-source.zip" --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload_release }}
        with:
          name: xiangqi-${{ steps.package.outputs.version }}-macos-arm64
          retention-days: 1
          path: |
            release/v${{ steps.package.outputs.version }}/xiangqi-screen-assistant-${{ steps.package.outputs.version }}-mac-arm64.dmg
            release/v${{ steps.package.outputs.version }}/xiangqi-screen-assistant-${{ steps.package.outputs.version }}-source.zip
